# RF Spectrum Analyzer - Default Configuration File
# This file contains the default settings for the application

# SDR Device Configuration
sdr:
  source: "auto"              # Device type: auto, pluto, rtlsdr, hackrf, soapy, audio, file
  center_freq: 433920000.0    # Center frequency in Hz (433.92 MHz)
  sample_rate: 2000000.0      # Sample rate in Hz (2 MSps)
  gain: 30.0                  # RF gain in dB
  bandwidth: null             # Bandwidth in Hz (null for auto)
  device_args: {}             # Device-specific arguments
  antenna: "RX"               # Antenna selection
  auto_gain: false            # Enable automatic gain control

# Digital Signal Processing Configuration
dsp:
  fft_size: 2048             # FFT size (must be power of 2)
  overlap: 0.5               # FFT overlap ratio (0.0 to 0.99)
  window: "hanning"          # Window type: hanning, hamming, blackman, rectangular
  averaging: 10              # Number of FFTs to average
  enable_filtering: true     # Enable digital filtering
  filter_type: "lowpass"     # Filter type: lowpass, highpass, bandpass, bandstop
  filter_cutoff: 1000000.0   # Filter cutoff frequency in Hz
  filter_order: 51           # Filter order (for FIR filters)
  enable_demodulation: false # Enable signal demodulation
  demod_type: "FM"           # Demodulation type: FM, AM, PM, PSK, QAM

# GUI Configuration
gui:
  theme: "auto"              # Theme: auto, light, dark
  window_width: 1200         # Main window width in pixels
  window_height: 800         # Main window height in pixels
  update_rate: 30            # Display update rate in FPS
  waterfall_height: 200      # Waterfall plot height in pixels
  spectrum_height: 300       # Spectrum plot height in pixels
  show_constellation: true   # Show constellation diagram
  show_iq_plot: true         # Show I/Q time domain plot
  font_size: 10              # GUI font size

# Processing Configuration
processing:
  enable_real_time: true     # Enable real-time processing
  buffer_size: 4096          # Buffer size for sample processing
  num_buffers: 16            # Number of buffers to use
  processing_threads: 2      # Number of processing threads
  enable_recording: false    # Enable signal recording
  record_format: "sigmf"     # Recording format: sigmf, wav, iq
  snapshot_trigger: "manual" # Snapshot trigger: manual, level, edge
  detection_threshold: -60.0 # Signal detection threshold in dBm

# Logging Configuration
logging:
  level: "INFO"              # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/rf_spectrum.log" # Log file path
  max_size: 10485760         # Max log file size in bytes (10MB)
  backup_count: 5            # Number of backup log files
  console_output: true       # Enable console output

# Advanced DSP Settings
advanced_dsp:
  # FIR Filter Settings
  fir_filters:
    enable_anti_aliasing: true
    enable_reconstruction: true
    custom_filters: []

  # IIR Filter Settings  
  iir_filters:
    enable_dc_blocker: true
    enable_notch_filters: false
    notch_frequencies: [50.0, 60.0]  # Hz

  # Modulation Analysis
  modulation:
    enable_auto_classification: true
    classification_confidence_threshold: 0.7
    supported_modulations: ["PSK", "QAM", "FSK", "MSK", "AM", "FM"]

  # Synchronization
  synchronization:
    enable_carrier_recovery: true
    enable_symbol_timing: true
    pll_loop_bandwidth: 0.01

# Device-Specific Settings
device_settings:
  # RTL-SDR specific settings
  rtlsdr:
    frequency_correction: 0    # PPM frequency correction
    enable_offset_tuning: false
    enable_bias_tee: false

  # PlutoSDR specific settings
  pluto:
    uri: "ip:192.168.2.1"     # PlutoSDR URI
    buffer_size: 4096

  # HackRF specific settings
  hackrf:
    enable_amp: false         # Enable RF amplifier
    enable_antenna_power: false
    lna_gain: 16              # LNA gain (0-40 dB)
    vga_gain: 20              # VGA gain (0-62 dB)

  # SoapySDR specific settings
  soapy:
    driver: "auto"            # SoapySDR driver to use
    device_args: {}           # Additional device arguments

# File I/O Settings
file_io:
  # Supported input formats
  input_formats: ["wav", "iq", "sigmf", "hackrf", "sdriq"]

  # Output settings
  output_directory: "recordings"
  default_format: "sigmf"
  enable_compression: false

  # IQ file settings
  iq_format: "complex64"     # complex64, complex128, int16
  byte_order: "little"       # little, big

# Performance Settings
performance:
  # CPU optimization
  enable_simd: true          # Enable SIMD optimizations
  fft_threads: 0             # Number of FFT threads (0 = auto)

  # Memory optimization
  max_memory_usage: 1073741824  # Max memory usage in bytes (1GB)
  enable_memory_mapping: false

  # GPU acceleration (if available)
  enable_gpu: false
  gpu_device: 0

# Network Settings (for remote operation)
network:
  enable_remote_control: false
  server_port: 8080
  websocket_port: 8081
  enable_authentication: false

# Calibration Settings
calibration:
  enable_frequency_calibration: false
  enable_amplitude_calibration: false
  enable_phase_calibration: false

  # Reference signals for calibration
  reference_frequencies: [100e6, 1e9]  # Hz
  reference_levels: [-20, -10]         # dBm

# Export Settings
export:
  # Screenshot settings
  screenshot_format: "png"
  screenshot_dpi: 300

  # Data export
  export_formats: ["csv", "json", "matlab", "numpy"]
  include_metadata: true

  # Report generation
  enable_reports: true
  report_format: "pdf"
  include_plots: true

# Debug Settings (for development)
debug:
  enable_debug_mode: false
  enable_profiling: false
  save_debug_data: false
  debug_data_directory: "debug"

  # Simulation mode (for testing without hardware)
  enable_simulation: false
  simulation_signal_type: "noise"      # noise, tone, sweep
  simulation_snr: 20.0                 # dB
