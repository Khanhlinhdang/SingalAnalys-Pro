# RF Spectrum Analyzer Test Configuration
# Configuration files for continuous integration and test automation

name: RF Spectrum Analyzer Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
        exclude:
          # Exclude some combinations to reduce CI load
          - os: macos-latest
            python-version: '3.8'
          - os: windows-latest
            python-version: '3.8'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libusb-1.0-0-dev \
          librtlsdr-dev \
          libhackrf-dev \
          libiio-dev \
          libad9361-dev \
          libsoapysdr-dev \
          soapysdr-tools \
          cmake \
          build-essential \
          pkg-config

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install \
          libusb \
          rtl-sdr \
          hackrf \
          libiio \
          libad9361 \
          soapysdr \
          cmake \
          pkg-config

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Windows dependencies would be installed via vcpkg or pre-built binaries
        # For now, tests will run in mock mode
        echo "Windows dependencies not fully automated"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pytest pytest-xvfb xmlrunner
        # Install optional dependencies for comprehensive testing
        pip install memory-profiler psutil matplotlib

    - name: Install Qt dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get install -y \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          libgl1-mesa-dev \
          xvfb

    - name: Run import tests
      run: |
        cd tests
        python run_tests.py --module imports --ci

    - name: Run fast tests
      run: |
        cd tests
        python run_tests.py --fast --ci

    - name: Run core tests
      run: |
        cd tests
        python run_tests.py --module core --ci

    - name: Run backend tests
      run: |
        cd tests
        python run_tests.py --module backends --ci

    - name: Run GUI tests (Linux with xvfb)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd tests
        xvfb-run -a python run_tests.py --module gui --ci

    - name: Run GUI tests (Windows/macOS)
      if: matrix.os != 'ubuntu-latest'
      run: |
        cd tests
        python run_tests.py --module gui --ci

    - name: Run integration tests
      run: |
        cd tests
        python run_tests.py --module integration --ci

    - name: Run performance tests
      run: |
        cd tests
        python run_tests.py --module debug_performance --ci

    - name: Run all tests with coverage
      run: |
        cd tests
        python run_tests.py --coverage --ci

    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@v3
      with:
        file: ./tests/test_results/coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: tests/test_results/

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy pylint

    - name: Run flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run black
      run: |
        black --check --diff .

    - name: Run isort
      run: |
        isort --check-only --diff .

    - name: Run mypy
      run: |
        mypy --ignore-missing-imports .

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run safety check
      run: |
        safety check

    - name: Run bandit security check
      run: |
        bandit -r . -f json -o bandit-report.json
        bandit -r . --severity-level medium

  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install documentation tools
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme

    - name: Build documentation
      run: |
        # This would build documentation if docs/ directory exists
        echo "Documentation build would go here"

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel

    - name: Build package
      run: |
        python -m build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-${{ matrix.os }}
        path: dist/