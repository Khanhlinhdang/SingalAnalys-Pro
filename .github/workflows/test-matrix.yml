name: RF Spectrum Analyzer CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  fast-tests:
    name: Fast Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r rf_spectrum_analyzer/requirements.txt

      - name: Run fast suite
        run: |
          python rf_spectrum_analyzer/tests/run_tests.py --fast --ci

  integration-tests:
    name: Integration Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: fast-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r rf_spectrum_analyzer/requirements.txt

      - name: Run pipeline E2E module
        run: |
          python rf_spectrum_analyzer/tests/run_tests.py --module pipeline_e2e --ci

      - name: Run integration module
        run: |
          python rf_spectrum_analyzer/tests/run_tests.py --module integration --ci

      - name: Run app-layer integration module
        run: |
          python rf_spectrum_analyzer/tests/run_tests.py --module app_layer_integration --ci
